<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CRM - Clientes</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background-color: #f0f2f5;
            color: #1a1a1a;
        }
        .topbar {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
        }
        .topbar h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .card h2 {
            margin-top: 0;
            font-size: 16px;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        input {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        button.secondary {
            background: #e2e8f0;
            color: #334155;
        }
        button.secondary:hover {
            background: #cbd5e1;
        }
        button.danger {
            background: #ef4444;
        }
        button.danger:hover {
            background: #dc2626;
        }
        .form-actions {
            grid-column: span 2;
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }
        tbody tr {
            border-bottom: 1px solid #f1f5f9;
        }
        tbody tr:hover {
            background: #f8fafc;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.ativo {
            background: #dcfce7;
            color: #166534;
        }
        .badge.inativo {
            background: #fee2e2;
            color: #991b1b;
        }
        .acoes {
            display: flex;
            gap: 6px;
        }
        .acoes button {
            padding: 6px 12px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="topbar">
    <h1>CRM - Gestão de Clientes</h1>
</div>

<div class="container">

    <div class="card">
        <h2 id="titulo-formulario">Cadastrar cliente</h2>
        <form id="form-cliente">
            <input type="hidden" id="cliente-id">
            <div class="form-grid">
                <input type="text" id="nome" placeholder="Nome" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="telefone" placeholder="Telefone" required>
                <input type="text" id="empresa" placeholder="Empresa">
                <input type="text" id="status" placeholder="Status (ativo/inativo)">
                <div class="form-actions">
                    <button type="submit" id="btn-salvar">Cadastrar</button>
                    <button type="button" class="secondary" id="btn-cancelar" style="display:none;">Cancelar edição</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Clientes</h2>
        <table>
            <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Empresa</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="tabela-clientes">
            </tbody>
        </table>
    </div>

</div>

<script>
    function excluirCliente(id) {
        if (confirm('Tem certeza que deseja excluir este cliente?')) {
            fetch(`http://localhost:8080/clientes/${id}`, {
                method: 'DELETE'
            })
                .then(() => {
                    location.reload();
                })
                .catch(erro => console.error('Erro ao excluir:', erro));
        }
    }

    function editarCliente(cliente) {
        document.getElementById('cliente-id').value = cliente.id;
        document.getElementById('nome').value = cliente.nome;
        document.getElementById('email').value = cliente.email;
        document.getElementById('telefone').value = cliente.telefone;
        document.getElementById('empresa').value = cliente.empresa || '';
        document.getElementById('status').value = cliente.status || '';

        document.getElementById('titulo-formulario').innerText = 'Editar cliente';
        document.getElementById('btn-salvar').innerText = 'Salvar alterações';
        document.getElementById('btn-cancelar').style.display = 'inline-block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicao() {
        document.getElementById('form-cliente').reset();
        document.getElementById('cliente-id').value = '';

        document.getElementById('titulo-formulario').innerText = 'Cadastrar cliente';
        document.getElementById('btn-salvar').innerText = 'Cadastrar';
        document.getElementById('btn-cancelar').style.display = 'none';
    }

    document.getElementById('btn-cancelar').addEventListener('click', cancelarEdicao);

    function carregarClientes() {
        fetch('http://localhost:8080/clientes')
            .then(resposta => resposta.json())
            .then(clientes => {
                const tabela = document.getElementById('tabela-clientes');
                tabela.innerHTML = '';

                clientes.forEach(cliente => {
                    const classeBadge = cliente.status === 'inativo' ? 'inativo' : 'ativo';
                    const linha = `
                        <tr>
                            <td>${cliente.nome}</td>
                            <td>${cliente.email}</td>
                            <td>${cliente.telefone}</td>
                            <td>${cliente.empresa || '-'}</td>
                            <td><span class="badge ${classeBadge}">${cliente.status || '-'}</span></td>
                            <td class="acoes">
                                <button class="secondary" onclick='editarCliente(${JSON.stringify(cliente)})'>Editar</button>
                                <button class="secondary" onclick="excluirCliente(${cliente.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                    tabela.innerHTML += linha;
                });
            })
            .catch(erro => console.error('Erro ao buscar clientes:', erro));
    }

    document.getElementById('form-cliente').addEventListener('submit', function(evento) {
        evento.preventDefault();

        const id = document.getElementById('cliente-id').value;

        const cliente = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            telefone: document.getElementById('telefone').value,
            empresa: document.getElementById('empresa').value,
            status: document.getElementById('status').value
        };

        const url = id
            ? `http://localhost:8080/clientes/${id}`
            : 'http://localhost:8080/clientes';

        const metodo = id ? 'PUT' : 'POST';

        fetch(url, {
            method: metodo,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cliente)
        })
            .then(resposta => resposta.json())
            .then(() => {
                cancelarEdicao();
                carregarClientes();
            })
            .catch(erro => console.error('Erro ao salvar:', erro));
    });

    carregarClientes();
</script>

</body>
</html>
